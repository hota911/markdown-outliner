name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Check tag matches versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const tag = process.env.TAG;
            const read = (f) => JSON.parse(require("fs").readFileSync(f, "utf8"));
            const errors = [];
            for (const f of ["manifest.json", "package.json"]) {
              if (read(f).version !== tag) errors.push(f + " version is " + read(f).version + ", tag is " + tag);
            }
            if (!(tag in read("versions.json"))) errors.push("versions.json has no entry for " + tag);
            if (errors.length) {
              console.error(errors.join("\n"));
              process.exit(1);
            }
          '
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
      - name: Create GitHub Release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" dist/main.js dist/manifest.json dist/styles.css \
            --title "$TAG" --generate-notes
