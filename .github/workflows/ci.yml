name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          # The npm cache needs a lockfile; skip caching while the project has no dependencies.
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - name: Install dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - run: npm test
      - run: npm run build
